<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <title>Music Personality Quiz</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="./assets/css/styles.css">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Baskervville+SC:wght@400..700&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap"
          rel="stylesheet">

</head>

<body class="background">

    <!-- musik -->
    <audio
        id="bgMusic"
        loop>

        <source
            src="./assets/audio/music.mp3"
            type="audio/mpeg">

    </audio>

    <!-- start -->
    <div
        id="start-screen"
        class="start-screen">

        <img
            src="./assets/img/vinyl.gif"
            class="vinyl-gif"
            alt="vinyl gif">

        <h1>MUSIC PERSONALITY QUIZ</h1>

        <div
    class="play-btn"
    onclick="startQuiz()">
</div>

    </div>

    <!-- actual quiz -->
    <div
        class="container py-5 hidden"
        id="quiz-wrapper">

        <!-- top btns -->
        <div class="top-buttons">

            <button
                class="small-btn"
                onclick="goHome()">

                HOME

            </button>

            <button
                class="small-btn"
                id="musicBtn"
                onclick="toggleMusic()">

                MUSIC: ON

            </button>

        </div>

        <div id="quiz-container"></div>

    </div>

    <script src="./assets/js/main.js"></script>

</body>

</html>
